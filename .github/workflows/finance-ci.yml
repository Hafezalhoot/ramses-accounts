name: Ramses Finance CI (synthetic only)

# Only the current main line is protected by automated checks.
# Historic branches may contain older workflows; never push to them to run CI.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Which isolated check to run?
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: ramses-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No environment secrets, production database, deployment, or external hospital services.
env:
  CI: 'true'
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  GOOGLE_SHEET_ID: ''
  GOOGLE_SERVICE_ACCOUNT_JSON: ''
  GOOGLE_SHEET_TARGET: ''

jobs:
  finance-smoke:
    name: Finance smoke (Python 3.13)
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout full historical Git lineage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Ensure no private database or secrets are tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(private/|\.env$)|\.(sqlite|sqlite3|db|rbe|bundle|zip)$'; then
            echo '::error::Sensitive/runtime file found in tracked repository tree'
            exit 1
          fi
      - name: Install source dependencies without secrets
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check
      - name: Python and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app.py bootstrap.py scripts tests
          for file in static/*.js; do
            if [ -f "$file" ]; then node --check "$file"; fi
          done
      - name: Run account, access and integrity smoke tests
        run: python -u scripts/ci_smoke.py

  full-regression:
    name: Full synthetic regression (fixture-aware)
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout full historical Git lineage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install source dependencies without secrets
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check
      - name: Execute independent per-test full QA
        shell: bash
        run: |
          set -euo pipefail
          rm -f QA_G2T_TEST_RESULTS.tsv
          python -u scripts/qa_g2t_full.py
      - name: Enforce fixture exception allowlist and results integrity
        if: always()
        run: python scripts/ci_audit_gate.py QA_G2T_TEST_RESULTS.tsv --summary-file ci_quality_summary.md
      - name: Publish quality summary to run
        if: always()
        shell: bash
        run: |
          if [ -f ci_quality_summary.md ]; then
            cat ci_quality_summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Full QA report missing; TESTS UNVERIFIED.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain sanitized status summary for 7 days
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ramses-qa-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci_quality_summary.md
          if-no-files-found: warn
          retention-days: 7
