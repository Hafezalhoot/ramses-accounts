name: Ramses CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ramses-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: ramses-security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full Git history with redaction
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all --full-history" --redact=100 --report-path="$RUNNER_TEMP/gitleaks-redacted.json" --report-format=json'
  core:
    name: ramses-core-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Build isolated Python 3.13 and Chromium runtime
        run: docker build --file tools/qa/Dockerfile --tag ramses-qa-fallback:v1 tools/qa
      - name: Financial, permissions, Arabic UI and Playwright regression
        run: python scripts/qa_ci.py --report-dir "$RUNNER_TEMP/ramses-public-ci"
      - name: Upload sanitized counts only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ramses-ci-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ramses-public-ci/public-summary.json
            ${{ runner.temp }}/ramses-public-ci/public-summary.md
          if-no-files-found: warn
          retention-days: 7
