name: Ramses accounting security and financial smoke
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  finance-and-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned-range project dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python/JS syntax
        run: |
          python -m compileall -q app.py bootstrap.py scripts tests
          for file in static/*.js; do node --check "$file"; done
      - name: Isolated accounting + authorization smoke tests
        run: python scripts/ci_smoke.py
      - name: Report independent blocked gate
        run: echo "Historical V8.0 upgrade and real-device UAT require separate authenticated evidence."
